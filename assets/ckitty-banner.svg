<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ckitty — a tiny terminal cat</title>
  <desc id="desc">A cute ASCII cat inside a dark terminal window.</desc>
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#182331"/>
      <stop offset="1" stop-color="#101720"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="22" fill="#080c11"/>
  <rect x="24" y="24" width="1152" height="312" rx="18" fill="#0d131b" stroke="#2b3a4b" stroke-width="2"/>
  <path d="M24 42a18 18 0 0 1 18-18h1116a18 18 0 0 1 18 18v44H24z" fill="url(#chrome)"/>
  <circle cx="55" cy="56" r="8" fill="#ff5f57"/>
  <circle cx="81" cy="56" r="8" fill="#febc2e"/>
  <circle cx="107" cy="56" r="8" fill="#28c840"/>
  <text x="600" y="63" text-anchor="middle" fill="#8d9bad" font-family="monospace" font-size="16">ckitty — terminal kitty</text>

  <text x="70" y="125" fill="#79d4c6" font-family="monospace" font-size="20">~ $ ckitty</text>
  <text x="70" y="165" fill="#f5c96b" font-family="monospace" font-size="22" filter="url(#glow)">   /\_/\   </text>
  <text x="70" y="190" fill="#f5f7fa" font-family="monospace" font-size="22">  ( o.o )  </text>
  <text x="70" y="215" fill="#f5f7fa" font-family="monospace" font-size="22">   &gt; w &lt;   </text>
  <text x="70" y="240" fill="#f5c96b" font-family="monospace" font-size="22"> .-~~~~~~-. </text>
  <text x="70" y="265" fill="#d8e0ea" font-family="monospace" font-size="22"> | o . o  | </text>
  <text x="70" y="290" fill="#f5c96b" font-family="monospace" font-size="22"> \________/ </text>
  <text x="70" y="315" fill="#f5f7fa" font-family="monospace" font-size="22">   (_) (_)  </text>

  <text x="715" y="168" fill="#f5f7fa" font-family="monospace" font-size="42" font-weight="700">ckitty</text>
  <text x="718" y="202" fill="#79d4c6" font-family="monospace" font-size="18">a tiny terminal cat</text>
  <text x="718" y="244" fill="#8d9bad" font-family="monospace" font-size="16">blinks · wiggles · occasionally</text>
  <text x="718" y="269" fill="#8d9bad" font-family="monospace" font-size="16">brings you a toy</text>
  <text x="718" y="310" fill="#f5c96b" font-family="monospace" font-size="16">press q to let it go</text>
</svg>
