name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-14
            label: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install ncurses (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev

      - name: Install ncurses (macOS)
        if: runner.os == 'macOS'
        run: brew install ncurses

      - name: Build and verify
        run: make check

      - name: Package binary
        env:
          ARCHIVE: ckitty-${{ github.ref_name }}-${{ matrix.label }}
        run: |
          mkdir "$ARCHIVE"
          cp ckitty README.md LICENSE "$ARCHIVE/"
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ckitty-${{ matrix.label }}
          path: |
            ckitty-*.tar.gz
            ckitty-*.sha256

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
