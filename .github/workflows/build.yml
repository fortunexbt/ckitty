name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install ncurses (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev

      - name: Install ncurses (macOS)
        if: runner.os == 'macOS'
        run: brew install ncurses

      - name: Build and test
        run: make check

      - name: Verify headless rendering
        run: |
          ./ckitty --dump --seed 123 sit --frame 0 > /tmp/ckitty-frame.txt
          test -s /tmp/ckitty-frame.txt
          ./ckitty --version

  sanitizer:
    name: Sanitizers (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ncurses
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev
      - name: Run sanitizer checks
        run: make sanitize
